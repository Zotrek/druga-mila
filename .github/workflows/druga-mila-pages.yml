# Generate mapy + deploy na Cloudflare Pages (*.pages.dev z hasłem).
#
# Sekrety:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_PAGES_PROJECT  — nazwa projektu Pages na CF
#
# Build: DRUGA_MILA_WEBAPP_URL=/api/formatka (same-origin).
# Na CF Pages env: CFP_PASSWORD + GAS_PROXY_BASE=https://….workers.dev
#
# W CF: wyłącz auto-build z Gita.
name: druga-mila — Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: druga-mila-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generuj mapę
        run: |
          export DRUGA_MILA_WEBAPP_URL="/api/formatka"
          npm run generate
          mkdir -p site
          cp index.html site/ 2>/dev/null || true
          # favicon / assets jeśli są w root
          for f in favicon.png favicon.ico; do
            if [ -f "$f" ]; then cp "$f" site/; fi
          done
          if [ ! -f site/index.html ]; then
            echo "::error::Brak site/index.html po generate"
            exit 1
          fi

      - name: Publikacja na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Brak CLOUDFLARE_API_TOKEN lub CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          PROJECT="${{ secrets.CLOUDFLARE_PAGES_PROJECT }}"
          if [ -z "$PROJECT" ]; then
            echo "::error::Brak CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy ./site --project-name="$PROJECT" --commit-dirty=true
